; lighting node. Board is a placeholder: change "esp32dev" if your ESP32 board differs.
[env:lighting]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../common
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -D NODE_NAME=\"lighting\"
