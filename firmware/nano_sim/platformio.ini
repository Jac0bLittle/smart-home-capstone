; Arduino Nano v3 (ATmega328P) sensor simulator for bench tests.
;   pio run -t upload && pio device monitor
; If upload fails with "not in sync", try env nano_oldboot (clone boards).
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

[env:nano_oldboot]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
