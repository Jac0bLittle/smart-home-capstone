; Smart Home Model - ESP32 node firmware (one project, four node types)
; Build one node:   pio run -e climate -t upload && pio device monitor
; The same source builds every subsystem; the env picks which one.
;
; SIM_INPUTS=1 lets the node run on a bare ESP32 dev board with nothing wired:
; inputs come from the serial console ("sim temp 28") or from MQTT
; (home/<sub>/node1/cmd/sim). Turn it off for the final build.

[platformio]
default_envs = climate

[env]
platform = espressif32@6.9.0        ; Arduino core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    256dpi/MQTT@^2.5.2
build_flags =
    -DSIM_INPUTS=1
    -DSIM_POT=0                      ; set to 1 if a pot is wired to GPIO34
    -DCORE_DEBUG_LEVEL=1

[env:climate]
build_flags = ${env.build_flags} -DNODE_CLIMATE

[env:alarm]
build_flags = ${env.build_flags} -DNODE_ALARM

[env:lighting]
build_flags = ${env.build_flags} -DNODE_LIGHTING

[env:solar]
build_flags = ${env.build_flags} -DNODE_SOLAR

; Lighting with the Nano's analog output (D5 -> divider -> 10k/10uF RC) on GPIO34 as lux.
[env:lighting_pot]
build_unflags = -DSIM_POT=0
build_flags = ${env.build_flags} -DSIM_POT=1 -DNODE_LIGHTING
