# Smart Home Model - Mosquitto broker settings
# Installed to /etc/mosquitto/conf.d/smarthome.conf by hub/install.sh.
# The stock /etc/mosquitto/mosquitto.conf already turns on persistence and
# logging and includes conf.d, so only the listener and security live here.

# Plain MQTT on the local network only (no TLS; see Device Configuration Sheet 2).
listener 1883
# Send small packets at once. Without this, Nagle + delayed ACK added ~40 ms to
# every ping/pong round trip in bench tests (1.4 ms median with it on).
set_tcp_nodelay true

# No anonymous clients; every device has its own login (sheet section 2).
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/smarthome.acl

# Keep queued QoS 1 messages for a node that drops briefly.
max_queued_messages 200
